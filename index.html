<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRNRHX | TERMINAL ACCESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #0f0;
            --color-bg: #0a0a0a;
            --color-dim: #003300;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-primary);
            font-family: 'VT323', monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-size: 1.25rem;
        }

        /* Terminal Scrollbar */
        #terminal-output::-webkit-scrollbar {
            width: 10px;
        }
        #terminal-output::-webkit-scrollbar-track {
            background: #001100;
        }
        #terminal-output::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            border: 2px solid #001100;
        }

        /* Input Styling */
        .cmd-input {
            background: transparent;
            border: none;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            width: 100%;
            caret-color: transparent; /* Custom caret handled by span */
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: var(--color-primary);
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .glitch {
            position: relative;
        }
        
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .glitch::before {
            left: 2px;
            text-shadow: -1px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim-1 5s infinite linear alternate-reverse;
        }
        
        .glitch::after {
            left: -2px;
            text-shadow: -1px 0 #00fff9;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim-2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(20px, 9999px, 15px, 0); }
            20% { clip: rect(60px, 9999px, 70px, 0); }
            40% { clip: rect(20px, 9999px, 5px, 0); }
            60% { clip: rect(80px, 9999px, 5px, 0); }
            80% { clip: rect(10px, 9999px, 60px, 0); }
            100% { clip: rect(50px, 9999px, 30px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(60px, 9999px, 15px, 0); }
            20% { clip: rect(20px, 9999px, 10px, 0); }
            40% { clip: rect(50px, 9999px, 80px, 0); }
            60% { clip: rect(10px, 9999px, 40px, 0); }
            80% { clip: rect(70px, 9999px, 20px, 0); }
            100% { clip: rect(30px, 9999px, 10px, 0); }
        }
    </style>
</head>
<body class="overflow-hidden bg-black" onclick="document.getElementById('command-input').focus()">

    <!-- Main Container -->
    <div class="relative z-10 h-full p-4 md:p-8 flex flex-col w-full">
        
        <!-- Header -->
        <header class="border-b-2 border-green-900 pb-2 mb-4 flex justify-between items-end select-none">
            <div>
                <h1 class="text-4xl md:text-5xl font-bold leading-none glitch" data-text="TRNRHX_SYSTEMS">TRNRHX_SYSTEMS</h1>
                <div class="text-sm opacity-70">v2.4.0 [UNSECURED CONNECTION]</div>
            </div>
            <div class="text-right hidden md:block text-sm">
                <div id="clock">00:00:00</div>
                <div class="text-red-500 animate-pulse">● LIVE</div>
            </div>
        </header>

        <!-- Terminal Output Area -->
        <div id="terminal-output" class="flex-grow overflow-y-auto mb-4 font-bold whitespace-pre-wrap leading-relaxed"></div>

        <!-- Input Line -->
        <div class="flex items-center bg-black bg-opacity-80 p-2 border border-green-900 rounded">
            <span class="mr-2 text-green-400">root@trnrhx:~$</span>
            <div class="relative flex-grow">
                <input type="text" id="command-input" class="cmd-input" autocomplete="off" spellcheck="false" autofocus>
                <span id="cursor-visual" class="cursor absolute top-1 left-0"></span>
            </div>
        </div>
        
        <!-- Mobile Keyboard Helper -->
        <div class="md:hidden mt-2 flex gap-2 overflow-x-auto pb-2 text-sm">
            <button onclick="runCmd('help')" class="border border-green-800 px-3 py-1 hover:bg-green-900">HELP</button>
            <button onclick="runCmd('projects')" class="border border-green-800 px-3 py-1 hover:bg-green-900">PROJECTS</button>
            <button onclick="runCmd('about')" class="border border-green-800 px-3 py-1 hover:bg-green-900">ABOUT</button>
            <button onclick="runCmd('clear')" class="border border-green-800 px-3 py-1 hover:bg-green-900">CLS</button>
        </div>
    </div>

    <script>
        // --- Clock ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toISOString().split('T')[1].split('.')[0] + ' UTC';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Terminal Logic ---
        const output = document.getElementById('terminal-output');
        const input = document.getElementById('command-input');
        const cursorVisual = document.getElementById('cursor-visual');
        
        let history = [];
        let historyIndex = -1;

        const fileSystem = {
            'about.txt': `
NAME: TRNRHX
ROLE: AI_TRAINER
EMPLOYER: INDEPENDENT_CONTRACTOR
STATUS: ACTIVE
LOCATION: [REMOTE]
BIO: Found at the intersection of engineering+design+tech+humanity 
     Thinker. Maker. Creator.`,
            'contact.txt': `
EMAIL: <a  href="mailto:turnerhicks@gmail.com">turnerhicks@gmail.com</a>
GITHUB: <a href="https://github.com/trnrhx" target="_blank" rel="noopener">github.com/trnrhx</a>
LINKEDIN: <a  href="https://www.linkedin.com/in/turner-hicks-65359053/" target="_blank" rel="noopener">linkedin.com/in/turner-hicks-65359053/</a>
INSTAGRAM: <a href="https://instagram.com/trnrhx" target="_blank" rel="noopener">instagram.com/trnrhx</a>
TWITTER: <a href="https://twitter.com/trnrhx" target="_blank" rel="noopener">twitter.com/trnrhx</a>
FACEBOOK: <a href="https://facebook.com/turner.hixx" target="_blank" rel="noopener">facebook.com/turner.hixx</a>
SIGNAL: [ENCRYPTED]`,
            'secrets.dat': `ACCESS DENIED. ENCRYPTION LEVEL 5 REQUIRED.`
        };

        const commands = {
            'help': {
                desc: 'List available commands',
                action: () => printOutput(`
AVAILABLE COMMANDS:
  <span class="text-white">help</span>      - Display this menu
  <span class="text-white">about</span>     - Display operator identity
  <span class="text-white">projects</span>  - List ongoing operations
  <span class="text-white">contact</span>   - Transmission channels
  <span class="text-white">clear</span>     - Clear terminal buffer
  <span class="text-white">cat</span>       - Print file content to standard output
  <span class="text-white">ls</span>        - List directory contents
  <span class="text-white">theme</span>     - Change system color (green/amber/cyan/red)
  <span class="text-white">hack</span>      - [WARNING] Initiate brute force
`)
            },
            'about': {
                desc: 'User info',
                action: () => typeText(fileSystem['about.txt'])
            },
            'whoami': {
                desc: 'Alias for about',
                action: () => typeText(fileSystem['about.txt'])
            },
            'contact': {
                desc: 'Contact info',
                action: () => printOutput(fileSystem['contact.txt'])
            },
            'ls': {
                desc: 'List files',
                action: () => printOutput(Object.keys(fileSystem).join('  ') + '  <span class="text-blue-400">system/</span>')
            },
            'cat': {
                desc: 'Read file',
                action: (args) => {
                    if (!args) return printOutput("Usage: cat [filename]", "text-red-500");
                    if (fileSystem[args]) return printOutput(fileSystem[args]);
                    return printOutput(`File not found: ${args}`, "text-red-500");
                }
            },
            'clear': {
                desc: 'Clear screen',
                action: () => output.innerHTML = ''
            },
            'cls': {
                desc: 'Clear screen',
                action: () => output.innerHTML = ''
            },
            'projects': {
                desc: 'List projects',
                action: () => {
                    printOutput(`
LOADING PROJECT DATABASE...
---------------------------
1. <a class="text-white" href="https://trnrhx.com/projects/ai_stack.html" target="_blank" rel="noopener">AI_STACK</a>   [ AI Resarch & Development]
   > Self hosted AI automation and workflow stack integrating n8n, Dify, PostgreSQL, NocoDB, Ollama, OpenClaw, Docling, SeaweedFS, and Caddy. 
   > Managed by iris_agent. 
   > Status: TESTING

2. <a class="text-white" href="https://www.trnrhx.com/projects/iris_agent.html" target="_blank" rel="noopener">IRIS_AGENT</a>   [ AI Agent ]
   > AI Agent specializing in system maintenance, automation, and self-improvement. 
   > Oversees AI-stack operations and optimizes workflows.
   > Status: OPERATIONAL

3. <a class="text-white" href="https://www.trnrhx.com/projects/apollo_agent.html" target="_blank" rel="noopener">APOLLO_AGENT</a>   [ AI Agent ]
   > Portable, hardware based AI agent with advanced TTS/STT capabilities.
   > Status: PLANNING

4. <a class="text-white" href="https://trnrhx.com/projects/glowing_horizon.html" target="_blank" rel="noopener">GLOWING_HORIZON</a>   [ Total Global Situational Awareness ]
   > Real time, web-based map visualization of worldwide data streams
   > Status: DEVELOPMENT

5. <a class="text-white" href="https://www.trnrhx.com/projects/neon_hacker/index.html" target="_blank" rel="noopener">NEON_HACKER</a>   [ 3D Web Game ]
   > Browser-based retro FPS with cyberpunk horror theme
   > Status: PROTOTYPE

`);
                }
            },
            'theme': {
                desc: 'Change color theme',
                action: (args) => {
                    const root = document.documentElement;
                    if (args === 'amber') root.style.setProperty('--color-primary', '#ffb000');
                    else if (args === 'cyan') root.style.setProperty('--color-primary', '#00ffff');
                    else if (args === 'red') root.style.setProperty('--color-primary', '#ff0000');
                    else if (args === 'green') root.style.setProperty('--color-primary', '#0f0');
                    else return printOutput("Usage: theme [green|amber|cyan|red]");
                    printOutput(`System theme updated to ${args || 'green'}.`);
                }
            },
            'sudo': {
                desc: 'Admin',
                action: () => printOutput("USER IS NOT IN THE SUDOERS FILE. THIS INCIDENT WILL BE REPORTED.", "text-red-500")
            },
            'hack': {
                desc: 'Simulation',
                action: () => {
                    const target = document.getElementById('terminal-output');
                    let i = 0;
                    const steps = [
                        "Initializing brute force attack...",
                        "Bypassing firewall...",
                        "Injecting payload...",
                        "Accessing mainframe...",
                        "Downloading sensitive data...",
                        "Covering tracks...",
                        "HACK COMPLETE. 0.0069BTC transferred to wallet."
                    ];
                    const interval = setInterval(() => {
                        if (i >= steps.length) clearInterval(interval);
                        else {
                            printOutput(`[${Math.random().toFixed(4)}] ${steps[i]}`, "text-yellow-500");
                            i++;
                            target.scrollTop = target.scrollHeight;
                        }
                    }, 800);
                }
            }
        };

        // --- Utils ---
        function printOutput(text, className = "") {
            const div = document.createElement('div');
            div.className = `mb-1 ${className}`;
            div.innerHTML = text;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function typeText(text, speed = 20) {
            const div = document.createElement('div');
            div.className = "mb-1";
            output.appendChild(div);
            let i = 0;
            const interval = setInterval(() => {
                div.textContent += text.charAt(i);
                output.scrollTop = output.scrollHeight;
                i++;
                if (i > text.length - 1) clearInterval(interval);
            }, speed);
        }

        const projectRoutes = {
            'ai_stack': 'https://www.trnrhx.com/projects/ai_stack.html',
            'iris_agent': 'https://www.trnrhx.com/projects/iris_agent.html',
            'apollo_agent': 'https://www.trnrhx.com/projects/apollo_agent.html',
            'glowing_horizon': 'https://trnrhx.com/projects/glowing_horizon.html',
            'neon_hacker': 'https://www.trnrhx.com/projects/neon_hacker/index.html',
        };

        async function runCmd(cmdString) {
            const parts = cmdString.trim().split(' ');
            const cmd = parts[0].toLowerCase();
            const args = parts[1];

            // Echo command
            printOutput(`<span class="opacity-50">root@trnrhx:~$</span> ${cmdString}`);

            if (cmd === '') return;

            // Intercept hidden project commands
            if (projectRoutes[cmd]) {
                printOutput(`Initiating secure connection to ${cmd}...`, "text-green-500");
                window.open(projectRoutes[cmd], '_blank');
                return;
            }

            if (commands[cmd]) {
                commands[cmd].action(args);
            } else {
                printOutput(`Command not found: ${cmd}. Type 'help' for list.`, "text-red-500");
            }
        }

        // --- Event Listeners ---
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = this.value;
                if (cmd) {
                    history.push(cmd);
                    historyIndex = history.length;
                    runCmd(cmd);
                }
                this.value = '';
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    this.value = history[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < history.length - 1) {
                    historyIndex++;
                    this.value = history[historyIndex];
                } else {
                    historyIndex = history.length;
                    this.value = '';
                }
            }
        });

        // Move custom cursor
        input.addEventListener('input', updateCursor);
        input.addEventListener('keyup', updateCursor);
        input.addEventListener('click', updateCursor);

        function updateCursor() {
            const text = input.value;
            // Calculate width of text (rough approximation for monospace)
            // For exact width we'd need a hidden span, but 0.6em usually works for monospace fonts
            cursorVisual.style.left = `${text.length * 0.58}em`; 
        }

        // Boot Sequence
        window.onload = () => {
            const bootText = [
               "BIOS DATE 11/15/95 14:22:54 VER 1.02",
                "CPU: Sun Microsystems UltraSPARC, SPEED: 143 MHz",
                "384MB RAM SYSTEM",
                "Loading TRNRHX_OS...",
                "Mounting file system...",
                "Establishing network connection...",
                "Secure shell active."
            ];
            
            let delay = 0;
            bootText.forEach((line, index) => {
                delay += Math.random() * 500 + 200;
                setTimeout(() => {
                    printOutput(line, "text-gray-500");
                    if (index === bootText.length - 1) {
                        setTimeout(() => {
                            printOutput("<br>Welcome to TRNRHX Terminal.", "text-xl text-white font-bold");
                            printOutput("Type <span class='text-white bg-green-900 px-1'>help</span> to see available commands.<br>");
                        }, 500);
                    }
                }, delay);
            });
        };

        // Force focus
        document.addEventListener('click', () => input.focus());
    </script>
</body>
</html>
